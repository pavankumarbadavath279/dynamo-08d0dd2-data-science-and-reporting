# Dynamo automated review — runs on every pull request.
#
# PROVIDED workflow: it runs the Dynamo review pipeline (static checks → rubric
# review → duplicate check → validation → agent trials) and posts the results as
# comments on your PR. The checks are maintained centrally by the Dynamo team, so
# please don't edit this file — edits here won't change the checks.

name: Dynamo Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dynamo-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests
        run: pytest --maxfail=1 --disable-warnings -q

    secrets: inherit
